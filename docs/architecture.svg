<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PatchReceipt verification architecture</title>
  <desc id="desc">Hosted allowlisted cases and trusted local Maven projects enter one deterministic verification engine, which performs strict patch preflight, compares observed filesystem changes, executes baseline proof and patched challenges, runs targeted mutation testing, applies fixed verdict gates, and emits three receipt formats.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#121510"/>
    </marker>
    <style>
      .title { font: 700 48px Arial, sans-serif; fill: #121510; }
      .eyebrow { font: 700 18px Arial, sans-serif; letter-spacing: 2px; fill: #5b6256; }
      .h { font: 700 27px Arial, sans-serif; fill: #121510; }
      .b { font: 400 18px Arial, sans-serif; fill: #41483f; }
      .small { font: 700 16px Arial, sans-serif; fill: #121510; }
      .box { fill: #e7e9e1; stroke: #121510; stroke-width: 2; rx: 18; }
      .accent { fill: #c7ff38; stroke: #121510; stroke-width: 2; rx: 18; }
      .out { fill: #f6f4ec; stroke: #121510; stroke-width: 2; rx: 14; }
      .line { fill: none; stroke: #121510; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f6f4ec"/>
  <text x="64" y="72" class="eyebrow">JAVA 21 &#183; SPRING BOOT &#183; NO RUNTIME AI</text>
  <text x="64" y="133" class="title">PatchReceipt verification architecture</text>
  <rect x="64" y="159" width="930" height="12" fill="#c7ff38"/>

  <rect x="64" y="238" width="280" height="165" class="box"/>
  <text x="92" y="277" class="h">Hosted dashboard</text>
  <text x="92" y="312" class="b">Allowlisted caseId + patchId</text>
  <text x="92" y="342" class="b">No uploads, URLs,</text>
  <text x="92" y="367" class="b">or commands</text>

  <rect x="64" y="440" width="280" height="150" class="box"/>
  <text x="92" y="479" class="h">Trusted local CLI</text>
  <text x="92" y="514" class="b">Small Java 21 Maven project</text>
  <text x="92" y="544" class="b">Explicit execution consent</text>

  <path d="M344 313 H424 V376 H492" class="line"/>
  <path d="M344 515 H424 V446 H492" class="line"/>

  <rect x="492" y="278" width="330" height="245" class="accent"/>
  <text x="526" y="323" class="eyebrow">DETERMINISTIC CORE</text>
  <text x="526" y="365" class="h">VerificationEngine</text>
  <text x="526" y="401" class="b">Strict diff preflight</text>
  <text x="526" y="426" class="b">Fresh workspace + JGit apply</text>
  <text x="526" y="451" class="b">Observed filesystem diff</text>
  <text x="526" y="476" class="b">Bounded process execution</text>
  <text x="526" y="501" class="b">Receipt schema v2 evidence</text>

  <path d="M822 345 H870 V293 H934" class="line"/>
  <path d="M822 400 H900 V468 H934" class="line"/>
  <path d="M822 455 H870 V643 H934" class="line"/>

  <rect x="934" y="218" width="295" height="150" class="box"/>
  <text x="960" y="257" class="small">MAVEN PROCESS 1</text>
  <text x="960" y="289" class="h">Prove before</text>
  <text x="960" y="319" class="b">Regressions + expected failure</text>

  <rect x="934" y="393" width="295" height="150" class="box"/>
  <text x="960" y="432" class="small">MAVEN PROCESS 2</text>
  <text x="960" y="464" class="h">Challenge after</text>
  <text x="960" y="494" class="b">Reproduction + regression</text>
  <text x="960" y="518" class="b">+ independent edge cases</text>

  <rect x="934" y="568" width="295" height="150" class="box"/>
  <text x="960" y="607" class="small">MAVEN PROCESS 3</text>
  <text x="960" y="639" class="h">Targeted PIT</text>
  <text x="960" y="669" class="b">Observed changed-line</text>
  <text x="960" y="693" class="b">mutation evidence</text>

  <path d="M1229 293 H1270 V370 H1316" class="line"/>
  <path d="M1229 468 H1270 V418 H1316" class="line"/>
  <path d="M1229 643 H1270 V466 H1316" class="line"/>

  <rect x="1316" y="333" width="220" height="170" class="accent"/>
  <text x="1344" y="373" class="small">FIXED GATES</text>
  <text x="1344" y="407" class="h">VerdictPolicy</text>
  <text x="1344" y="443" class="b">Rejected</text>
  <text x="1344" y="470" class="b">Partially verified</text>
  <text x="1344" y="497" class="b">Verified</text>

  <path d="M1426 503 V592" class="line"/>
  <rect x="1280" y="626" width="292" height="106" class="out"/>
  <text x="1308" y="665" class="h">Canonical receipt</text>
  <text x="1308" y="699" class="b">Schema v2 &#183; stages &#183; digest</text>

  <path d="M1300 732 V805" class="line"/>
  <path d="M1426 732 V805" class="line"/>
  <path d="M1522 732 V805" class="line"/>
  <rect x="1223" y="805" width="154" height="58" class="out"/>
  <rect x="1380" y="805" width="92" height="58" class="out"/>
  <rect x="1476" y="805" width="92" height="58" class="out"/>
  <text x="1250" y="841" class="small">HTML</text>
  <text x="1396" y="841" class="small">MD</text>
  <text x="1492" y="841" class="small">JSON</text>

  <text x="64" y="840" class="eyebrow">SAFETY COMES FROM BUNDLED ALLOWLISTING &#8212; NOT FROM CLAIMING A GENERAL SANDBOX</text>
</svg>
