spring.application.name=PatchReceipt
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.shutdown=graceful
server.port=${PORT:8080}

patchreceipt.application-root=${user.dir}
patchreceipt.workspace-root=${user.dir}/.patchreceipt-work
patchreceipt.maven-user-home=${user.dir}/.cache/maven
patchreceipt.runner.offline=false
patchreceipt.runner.keep-workspaces=false
