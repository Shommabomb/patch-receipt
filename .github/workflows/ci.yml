name: PatchReceipt CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_USER_HOME: ${{ github.workspace }}/.cache/maven

concurrency:
  group: patchreceipt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-unit:
    name: Windows unit and safety suite
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v5
        with:
          path: .cache/maven
          key: windows-maven-${{ hashFiles('pom.xml', '.mvn/**', 'src/main/resources/demo-cases/**/pom.xml') }}
          restore-keys: windows-maven-
      - name: Run unit and safety tests
        shell: pwsh
        run: .\mvnw.cmd -B -ntp "-Dtest=!VerticalSliceIntegrationTests" test

  ubuntu-verification:
    name: Ubuntu full verification and PIT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v5
        with:
          path: .cache/maven
          key: ubuntu-maven-${{ hashFiles('pom.xml', '.mvn/**', 'src/main/resources/demo-cases/**/pom.xml') }}
          restore-keys: ubuntu-maven-
      - name: Run full verification
        run: ./mvnw -B -ntp verify
      - name: Upload vertical-slice evidence
        uses: actions/upload-artifact@v7
        with:
          name: vertical-slice-receipt
          path: target/vertical-slice-receipt.json
          if-no-files-found: error

  container:
    name: Production container
    runs-on: ubuntu-latest
    needs: [windows-unit, ubuntu-verification]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build image with offline verifier cache
        run: docker build --tag patchreceipt:${{ github.sha }} .
      - name: Start image
        run: |
          docker run --detach --rm --name patchreceipt-ci \
            --memory=1g --cpus=2 -p 18080:8080 \
            patchreceipt:${{ github.sha }}
      - name: Wait for health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs patchreceipt-ci
          exit 1
      - name: Check hosted allowlist
        run: |
          curl --fail --silent http://127.0.0.1:18080/api/v1/cases \
            | grep --quiet '"minimal-robust"'
      - name: Run full verification inside production image
        run: |
          start_response="$(
            curl --fail --silent \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"caseId":"checkout-coupons","patchId":"minimal-robust"}' \
              http://127.0.0.1:18080/api/v1/runs
          )"
          run_id="$(jq --raw-output '.runId' <<<"$start_response")"
          test -n "$run_id"
          test "$run_id" != "null"

          for attempt in {1..120}; do
            status_response="$(
              curl --fail --silent \
                --header 'Cache-Control: no-cache' \
                "http://127.0.0.1:18080/api/v1/runs/$run_id"
            )"
            state="$(jq --raw-output '.state' <<<"$status_response")"
            if [ "$state" = "COMPLETED" ]; then
              test "$(jq --raw-output '.verdict' <<<"$status_response")" = "VERIFIED"
              receipt="$(
                curl --fail --silent \
                  "http://127.0.0.1:18080/api/v1/runs/$run_id/receipt.json"
              )"
              test "$(jq --raw-output '.schemaVersion' <<<"$receipt")" = "2"
              test "$(jq --raw-output '.scope.provenance' <<<"$receipt")" = \
                "OBSERVED_FILESYSTEM"
              test "$(jq --raw-output '.mutation.processHealthy' <<<"$receipt")" = \
                "true"
              test "$(jq --raw-output '.mutation.changedLineMutants' <<<"$receipt")" -ge \
                "$(jq --raw-output '.mutation.requiredChangedLineMutants' <<<"$receipt")"
              exit 0
            fi
            if [ "$state" = "FAILED" ]; then
              jq . <<<"$status_response"
              docker logs patchreceipt-ci
              exit 1
            fi
            sleep 1
          done
          docker logs patchreceipt-ci
          exit 1
      - name: Stop image
        if: always()
        run: docker stop patchreceipt-ci || true

  evaluation:
    name: On-demand six-patch evaluation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v5
        with:
          path: .cache/maven
          key: ubuntu-evaluation-maven-${{ hashFiles('pom.xml', '.mvn/**', 'src/main/resources/demo-cases/**/pom.xml') }}
          restore-keys: ubuntu-maven-
      - name: Run ground-truthed evaluation corpus
        run: |
          ./mvnw -B -ntp \
            -Dpatchreceipt.evaluation=true \
            -Dtest=EvaluationCorpusIntegrationTests \
            test
      - name: Upload evaluation receipts
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-receipts
          path: target/evaluation-receipts
          if-no-files-found: error
